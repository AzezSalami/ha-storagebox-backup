name: Remote Backup
version: "1.2.2"
slug: storagebox_backup
description: Encrypted, versioned backups of your Home Assistant files to Hetzner, Hostinger, any SFTP/SSH server or S3 storage (restic)
url: https://github.com/AzezSalami/ha-storagebox-backup
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:cloud-upload
panel_title: Remote Backup
homeassistant_api: true
map:
  - config:ro
  - addon_configs:ro
  - ssl:ro
  - media:ro
  - backup:ro
  - share:rw
